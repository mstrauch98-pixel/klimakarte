<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsere Klimakarte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    header {
      height: 82px;
      padding: 16px;
      background: #16324f;
      color: white;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 24px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 82px);
      min-height: 400px;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      line-height: 1.7;
      font-size: 14px;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-color {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid #999;
    }

    .popup {
      min-width: 250px;
      max-width: 330px;
    }

    .popup-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .popup-country {
      color: #555;
      margin-bottom: 12px;
    }

    .popup-zone {
      background: #e8f1f7;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .data-row {
      margin: 9px 0;
      line-height: 1.4;
    }

    .data-label {
      font-weight: bold;
    }

    .no-data {
      color: #777;
      font-style: italic;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Unsere Klimakarte</h1>
  <div>Raumbeispiele unserer Unterrichtseinheit</div>
</header>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

  // ==================================================
  // SUPABASE
  // ==================================================

  const SUPABASE_URL =
    "https://wtfwbelrlorgggcyyztj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uSIbU0bHTGfcTDqoDuSiAQ_VwdT8R9o";


  // ==================================================
  // 1. KARTE SOFORT ERSTELLEN
  // ==================================================

  const map = L.map("map").setView([10, 0], 2);


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap-Mitwirkende"
    }
  ).addTo(map);


  // ==================================================
  // 2. KLIMAGÜRTEL
  // ==================================================

  function addZone(
    name,
    south,
    north,
    color
  ) {

    L.rectangle(
      [
        [south, -180],
        [north, 180]
      ],
      {
        color: color,
        fillColor: color,
        fillOpacity: 0.22,
        weight: 1
      }
    )
    .addTo(map)
    .bindTooltip(name);

  }


  // Nordhalbkugel

  addZone(
    "Polarzone",
    66.5,
    90,
    "#cfe8f3"
  );

  addZone(
    "Subpolarzone",
    55,
    66.5,
    "#b7d7e8"
  );

  addZone(
    "Gemäßigte Zone",
    40,
    55,
    "#b8d8ba"
  );

  addZone(
    "Subtropen",
    23.5,
    40,
    "#f4d58d"
  );

  addZone(
    "Tropen",
    -23.5,
    23.5,
    "#f3a261"
  );


  // Südhalbkugel

  addZone(
    "Subtropen",
    -40,
    -23.5,
    "#f4d58d"
  );

  addZone(
    "Gemäßigte Zone",
    -55,
    -40,
    "#b8d8ba"
  );

  addZone(
    "Subpolarzone",
    -66.5,
    -55,
    "#b7d7e8"
  );

  addZone(
    "Polarzone",
    -90,
    -66.5,
    "#cfe8f3"
  );


  // ==================================================
  // 3. LEGENDE
  // ==================================================

  const legend =
    L.control({
      position: "bottomright"
    });


  legend.onAdd = function () {

    const div =
      L.DomUtil.create(
        "div",
        "legend"
      );


    div.innerHTML = `

      <div class="legend-title">
        Klimagürtel
      </div>

      <div class="legend-item">
        <span
          class="legend-color"
          style="background:#cfe8f3">
        </span>
        Polarzone
      </div>

      <div class="legend-item">
        <span
          class="legend-color"
          style="background:#b7d7e8">
        </span>
        Subpolarzone
      </div>

      <div class="legend-item">
        <span
          class="legend-color"
          style="background:#b8d8ba">
        </span>
        Gemäßigte Zone
      </div>

      <div class="legend-item">
        <span
          class="legend-color"
          style="background:#f4d58d">
        </span>
        Subtropen
      </div>

      <div class="legend-item">
        <span
          class="legend-color"
          style="background:#f3a261">
        </span>
        Tropen
      </div>

    `;

    return div;
  };


  legend.addTo(map);


  // ==================================================
  // 4. HILFSFUNKTION
  // ==================================================

  function text(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return (
        '<span class="no-data">' +
        'Noch keine Angaben' +
        '</span>'
      );

    }

    return String(value);

  }


  // ==================================================
  // 5. KLIMADATEN LADEN
  // ==================================================

  async function loadResult(placeId) {

    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/place_results" +
          "?select=*" +
          "&place_id=eq." +
          placeId +
          "&order=created_at.desc" +
          "&limit=1",

          {
            headers: {
              "apikey": SUPABASE_KEY
            }
          }

        );


      if (!response.ok) {

        console.log(
          "Klimadaten konnten nicht geladen werden."
        );

        return null;

      }


      const data =
        await response.json();


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        return null;

      }


      return data[0];

    }

    catch (error) {

      console.log(
        "Fehler bei Klimadaten:",
        error
      );

      return null;

    }

  }


  // ==================================================
  // 6. POPUP FÜR EINEN ORT
  // ==================================================

  async function showPlace(
    marker,
    place
  ) {

    marker
      .bindPopup(
        "<div class='popup'>" +
        "Klimadaten werden geladen …" +
        "</div>"
      )
      .openPopup();


    const result =
      await loadResult(place.id);


    let climateZone =
      "Noch keine Angabe";


    if (
      place.climate_zones &&
      place.climate_zones.name
    ) {

      climateZone =
        place.climate_zones.name;

    }


    let html = `

      <div class="popup">

        <div class="popup-title">
          ${text(place.name)}
        </div>

        <div class="popup-country">
          ${text(place.country)}
        </div>

        <div class="popup-zone">
          🌍 <strong>Klimazone:</strong><br>
          ${text(climateZone)}
        </div>

    `;


    if (result) {

      html += `

        <div class="data-row">
          <span class="data-label">
            🌡️ Temperatur:
          </span><br>
          ${text(result.temperature)}
        </div>

        <div class="data-row">
          <span class="data-label">
            🌧️ Niederschlag:
          </span><br>
          ${text(result.precipitation)}
        </div>

        <div class="data-row">
          <span class="data-label">
            🌿 Vegetation:
          </span><br>
          ${text(result.vegetation)}
        </div>

        <div class="data-row">
          <span class="data-label">
            🏘️ Menschliche Nutzung:
          </span><br>
          ${text(result.human_use)}
        </div>

        <div class="data-row">
          <span class="data-label">
            💡 Erkenntnisse:
          </span><br>
          ${text(result.findings)}
        </div>

      `;

    } else {

      html += `

        <div class="data-row">
          <span class="no-data">
            Noch keine Untersuchungsergebnisse
            vorhanden.
          </span>
        </div>

      `;

    }


    html += "</div>";


    marker.setPopupContent(html);

  }


  // ==================================================
  // 7. ORTE AUS SUPABASE LADEN
  // ==================================================

  async function loadPlaces() {

    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/places" +
          "?select=*,climate_zones(name)",

          {
            headers: {
              "apikey": SUPABASE_KEY
            }
          }

        );


      if (!response.ok) {

        console.log(
          "Supabase konnte die Orte nicht laden."
        );

        return;

      }


      const places =
        await response.json();


      places.forEach(
        function(place) {

          const marker =
            L.marker([
              place.latitude,
              place.longitude
            ])
            .addTo(map);


          marker.on(
            "click",
            function() {

              showPlace(
                marker,
                place
              );

            }
          );

        }
      );


    }

    catch (error) {

      console.log(
        "Fehler beim Laden der Orte:",
        error
      );

    }

  }


  // ==================================================
  // 8. START
  // ==================================================

  loadPlaces();


</script>

</body>
</html>
```
