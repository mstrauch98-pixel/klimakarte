```html
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsere Klimakarte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
    }

    header {
      padding: 16px;
      background: #16324f;
      color: white;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    #map {
      height: calc(100vh - 82px);
      width: 100%;
    }

    .popup {
      min-width: 250px;
      max-width: 330px;
    }

    .popup-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .popup-country {
      color: #555;
      margin-bottom: 12px;
    }

    .popup-zone {
      background: #e8f1f7;
      padding: 7px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .data-row {
      margin: 9px 0;
      line-height: 1.4;
    }

    .data-label {
      font-weight: bold;
    }

    .no-data {
      color: #777;
      font-style: italic;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Unsere Klimakarte</h1>
  <div>Raumbeispiele unserer Unterrichtseinheit</div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ==================================================
  // SUPABASE
  // ==================================================

  const SUPABASE_URL =
    "https://wtfwbelrlorgggcyyztj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uSIbU0bHTGfcTDqoDuSiAQ_VwdT8R9o";


  // ==================================================
  // KARTE
  // ==================================================

  const map = L.map("map").setView([10, 0], 2);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap-Mitwirkende"
    }
  ).addTo(map);


  // ==================================================
  // HILFSFUNKTION
  // ==================================================

  function text(wert) {

    if (
      wert === null ||
      wert === undefined ||
      wert === ""
    ) {
      return '<span class="no-data">Noch keine Angaben</span>';
    }

    return String(wert);
  }


  // ==================================================
  // KLIMADATEN FÜR EINEN ORT LADEN
  // ==================================================

  async function loadResult(placeId) {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/place_results?select=*&place_id=eq." +
      placeId +
      "&order=created_at.desc&limit=1",
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {

      console.error(
        "Fehler beim Laden der Klimadaten:",
        await response.text()
      );

      return null;
    }

    const results = await response.json();

    if (results.length === 0) {
      return null;
    }

    return results[0];
  }


  // ==================================================
  // POPUP
  // ==================================================

  async function openPlacePopup(marker, place) {

    marker.bindPopup(
      "<div class='popup'>Klimadaten werden geladen …</div>"
    ).openPopup();


    const result =
      await loadResult(place.id);


    const climateZone =
      place.climate_zones
        ? place.climate_zones.name
        : null;


    let popup = `

      <div class="popup">

        <div class="popup-title">
          ${text(place.name)}
        </div>

        <div class="popup-country">
          ${text(place.country)}
        </div>

        <div class="popup-zone">
          🌍 <strong>Klimazone:</strong><br>
          ${text(climateZone)}
        </div>

    `;


    if (result) {

      popup += `

        <div class="data-row">
          <span class="data-label">🌡️ Temperatur:</span><br>
          ${text(result.temperature)}
        </div>

        <div class="data-row">
          <span class="data-label">🌧️ Niederschlag:</span><br>
          ${text(result.precipitation)}
        </div>

        <div class="data-row">
          <span class="data-label">🌿 Vegetation:</span><br>
          ${text(result.vegetation)}
        </div>

        <div class="data-row">
          <span class="data-label">🏘️ Menschliche Nutzung:</span><br>
          ${text(result.human_use)}
        </div>

        <div class="data-row">
          <span class="data-label">💡 Erkenntnisse:</span><br>
          ${text(result.findings)}
        </div>

      `;

    } else {

      popup += `

        <div class="data-row">
          <span class="no-data">
            Für dieses Raumbeispiel wurden noch
            keine Untersuchungsergebnisse eingetragen.
          </span>
        </div>

      `;

    }


    popup += "</div>";


    marker.setPopupContent(popup);
  }


  // ==================================================
  // ORTE AUS SUPABASE LADEN
  // ==================================================

  async function loadPlaces() {

    console.log("Lade Raumbeispiele …");


    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/places" +
      "?select=*,climate_zones(name)",

      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }

    );


    if (!response.ok) {

      const error =
        await response.text();

      alert(
        "Supabase-Fehler: " + error
      );

      return;
    }


    const places =
      await response.json();


    console.log(
      "Gefundene Orte:",
      places
    );


    // ================================================
    // MARKER ERSTELLEN
    // ================================================

    places.forEach(place => {

      const marker =
        L.marker([
          place.latitude,
          place.longitude
        ]).addTo(map);


      marker.on(
        "click",
        () => openPlacePopup(marker, place)
      );

    });

  }


  // ==================================================
  // START
  // ==================================================

  loadPlaces();

</script>

</body>
</html>
```
