<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsere Klimakarte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #16324f;
      color: white;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    #map {
      height: calc(100vh - 82px);
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Unsere Klimakarte</h1>
  <div>Raumbeispiele unserer Unterrichtseinheit</div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL =
  "https://wtfwbelrlorgggcyyztj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uSIbU0bHTGfcTDqoDuSiAQ_VwdT8R9o";


const map = L.map("map").setView([10, 0], 2);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap-Mitwirkende"
  }
).addTo(map);


async function loadPlaces() {

  console.log("1. Verbindung wird getestet...");

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/places?select=name,country,latitude,longitude",
    {
      headers: {
        "apikey": SUPABASE_KEY
      }
    }
  );

  console.log(
    "2. Antwort von Supabase:",
    response.status
  );

  const text = await response.text();

  console.log(
    "3. Daten:",
    text
  );


  if (!response.ok) {

    alert(
      "Supabase-Fehler: " + text
    );

    return;
  }


  const places = JSON.parse(text);


  places.forEach(place => {

    L.marker([
      place.latitude,
      place.longitude
    ])

    .addTo(map)

    .bindPopup(
      "<strong>" +
      place.name +
      "</strong><br>" +
      (place.country || "")
    );

  });

}


loadPlaces();

</script>

</body>
</html>
