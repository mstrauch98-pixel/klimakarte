<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Klimakarte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #16324f;
      color: white;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    #map {
      height: calc(100vh - 82px);
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Unsere Klimakarte</h1>
  <div>Raumbeispiele unserer Unterrichtseinheit</div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SUPABASE_URL =
  "https://wtfwbelrlorgggcyyztj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PBHUmi2d2c1qGPFTEjS67w_9lrGhPlf";

const map = L.map("map").setView([10, 0], 2);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap-Mitwirkende"
  }
).addTo(map);

async function loadPlaces() {
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/places?select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    console.error("Fehler beim Laden der Orte:", await response.text());
    return;
  }

  const places = await response.json();

  places.forEach(place => {
    L.marker([place.latitude, place.longitude])
      .addTo(map)
      .bindPopup(`
        <h2>${place.name}</h2>
        <strong>${place.country || ""}</strong>
        <p>${place.description || ""}</p>
      `);
  });
}

loadPlaces();
</script>

</body>
</html>
