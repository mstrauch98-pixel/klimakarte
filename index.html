<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Klimakarte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      padding: 18px;
      background: #16324f;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    #map {
      height: calc(100vh - 92px);
      width: 100%;
    }

    .info-box {
      padding: 10px;
      line-height: 1.5;
    }

    .info-box h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Unsere Klimakarte</h1>
  <p>Raumbeispiele und Klimazonen unserer Unterrichtseinheit</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Weltkarte
  const map = L.map('map').setView([10, 0], 2);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }
  ).addTo(map);

  // Klimazonen – zunächst vereinfacht dargestellt
  const zones = [
    {
      name: "Tropen",
      color: "#2e8b57",
      bounds: [[23.5, -180], [-23.5, 180]]
    },
    {
      name: "Subtropen",
      color: "#e6b84a",
      bounds: [[35, -180], [23.5, 180]]
    },
    {
      name: "Gemäßigte Zone",
      color: "#75aadb",
      bounds: [[60, -180], [35, 180]]
    }
  ];

  zones.forEach(zone => {
    L.rectangle(zone.bounds, {
      color: zone.color,
      weight: 1,
      fillColor: zone.color,
      fillOpacity: 0.12
    })
    .bindPopup(
      `<div class="info-box">
        <h2>${zone.name}</h2>
        <p>Klimazone unserer Unterrichtseinheit.</p>
      </div>`
    )
    .addTo(map);
  });

  // Golfito
  L.marker([8.6390, -83.1660])
    .addTo(map)
    .bindPopup(`
      <div class="info-box">
        <h2>🌴 Golfito</h2>
        <strong>Costa Rica</strong>
        <p>Klimazone: Tropen</p>
        <p>Raumbeispiel unserer Unterrichtseinheit.</p>
      </div>
    `);

  // Belém
  L.marker([-1.4558, -48.4902])
    .addTo(map)
    .bindPopup(`
      <div class="info-box">
        <h2>🌿 Belém</h2>
        <strong>Brasilien</strong>
        <p>Klimazone: Tropen</p>
        <p>Raumbeispiel unserer Unterrichtseinheit.</p>
      </div>
    `);
</script>

</body>
</html>
